name: Build APK
on: { push: { branches: [main, master] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Apply app logo
        run: cp -r resources/android/res/* android/app/src/main/res/
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk OptionsDesk.apk
      - uses: actions/upload-artifact@v4
        with: { name: OptionsDesk-apk, path: OptionsDesk.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "v${{ github.run_number }}", name: "Options Desk build ${{ github.run_number }}", files: OptionsDesk.apk }
